<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RUNNING</title>
</head>
<body>
<h1>SandScript RegExp browser smoke test</h1>
<p>Exercises the public session API — literals, constructor, exec/test,
all six string methods, replacement callbacks, tiny-fuel pauses with GC,
and the no-host-fallback rejection — inside a real browser.</p>
<pre id="results" role="status" aria-live="polite">running…</pre>
<script type="module">
import { freshSession } from '../../src/host-owned-session.js';
import { parseAndSetup } from '../fuel/test-helpers.js';

const failures = [];
const passes = [];

function check(name, actual, expected) {
  const a = JSON.stringify(actual);
  const e = JSON.stringify(expected);
  if (a === e) passes.push(name);
  else failures.push(`${name}: got ${a}, want ${e}`);
}

function run(source) {
  const session = freshSession({ inlineSource: true });
  parseAndSetup(session, source);
  const result = session.run(0, 100000000);
  if (result.status !== 'done') {
    throw new Error(`run did not complete: ${result.status}`);
  }
  return session;
}

try {
  // Literals, constructor, property surface.
  const s1 = run(String.raw`
    let lit = /ab+c/gi;
    let props = [lit.source, lit.flags, lit.global, lit.ignoreCase, lit.sticky];
    let ctor = new RegExp('\\d{2,}', 'd');
    let ctorProps = [ctor.source, ctor.hasIndices];
  `);
  check('literal props', s1.get(0, 'props'), ['ab+c', 'gi', true, true, false]);
  check('ctor props', s1.get(0, 'ctorProps'), ['\\d{2,}', true]);

  // exec/test, named groups, d indices, lastIndex.
  const s2 = run(String.raw`
    let m = /(?<yr>\d{4})-(?<mo>\d{2})/d.exec('on 2026-08 ok');
    let bits = [m[0], m.groups.yr, m.groups.mo, m.index, m.indices.groups.mo];
    let g = /o/g;
    let seq = [];
    let hit;
    while ((hit = g.exec('foo boo')) !== null) { seq.push([hit.index, g.lastIndex]); }
    let t = /b+/.test('abc');
  `);
  check('exec named+d', s2.get(0, 'bits'), ['2026-08', '2026', '08', 3, [8, 10]]);
  check('exec g loop', s2.get(0, 'seq'), [[1, 2], [2, 3], [5, 6], [6, 7]]);
  check('test', s2.get(0, 't'), true);

  // The six string methods, tokens, callbacks, scalar indices.
  const s3 = run(String.raw`
    let s = 'xx abc-2026 def-11 é€ tail';
    let found = s.search(/def/);
    let mg = s.match(/[a-z]+-\d+/g);
    let mm = [];
    for (const h of s.matchAll(/(\w+)-(\d+)/g)) mm.push([h[1], h[2], h.index]);
    let parts = s.split(/\s+/);
    let toks = 'john smith'.replace(/(?<first>\w+) (?<last>\w+)/, '$<last>, $<first>');
    let cb = s.replace(/(\w+)-(\d+)/g, (m, w, n, off) => '[' + n + ':' + w + ':' + off + ']');
    let ra = 'a1b2'.replaceAll(/\d/g, '#');
    let uni = 'aé€b'.match(/./g);
  `);
  check('search', s3.get(0, 'found'), 12);
  check('match g', s3.get(0, 'mg'), ['abc-2026', 'def-11']);
  check('matchAll', s3.get(0, 'mm'), [['abc', '2026', 3], ['def', '11', 12]]);
  check('split', s3.get(0, 'parts'), ['xx', 'abc-2026', 'def-11', 'é€', 'tail']);
  check('tokens', s3.get(0, 'toks'), 'smith, john');
  check('callback', s3.get(0, 'cb'), 'xx [2026:abc:3] [11:def:12] é€ tail');
  check('replaceAll', s3.get(0, 'ra'), 'a#b#');
  check('unicode match', s3.get(0, 'uni'), ['a', 'é', '€', 'b']);

  // Tiny-fuel pauses with GC on every pause, in the browser.
  {
    const tiny = freshSession({ inlineSource: true });
    parseAndSetup(tiny, String.raw`
      let s = 'xx abc-2026 def-11 ghi-999 tail';
      let r = s.replace(/(\w+)-(\d+)/g, (m, w, n) => w.toUpperCase() + n);
      let done = 42;
    `);
    let pauses = 0;
    let guard = 0;
    for (; guard < 500000; guard++) {
      tiny.mem.wasm.exports.run(1, 0);
      const condition = tiny.mem.getExitCondition(0);
      if (condition === 15) { tiny.gc(); continue; }
      if (condition === 2) { pauses++; tiny.gc(); continue; }
      break;
    }
    check('tiny-fuel completes', tiny.mem.getExitCondition(0), 1);
    check('tiny-fuel paused', pauses > 50, true);
    check('tiny-fuel result', tiny.get(0, 'r'), 'xx ABC2026 DEF11 GHI999 tail');
    check('tiny-fuel done', tiny.get(0, 'done'), 42);
  }

  // No host fallback: lookbehind works in this very browser's own
  // JavaScript engine but must reject inside SandScript.
  {
    const hostAccepts = (() => {
      try { new RegExp('(?<=a)b'); return true; } catch { return false; }
    })();
    const s4 = run(String.raw`
      let outcome = 'no throw';
      try { new RegExp('(?<=a)b'); } catch (e) { outcome = '' + e; }
    `);
    check('host accepts lookbehind', hostAccepts, true);
    check('sandbox rejects lookbehind', s4.get(0, 'outcome'), 'TypeError');
  }
} catch (e) {
  failures.push(`threw: ${e && e.message ? e.message : e}`);
}

const verdict = failures.length === 0 ? 'PASS' : 'FAIL';
document.title = verdict;
document.getElementById('results').textContent =
  `${verdict}\npassed: ${passes.length}\nfailed: ${failures.length}\n` +
  failures.map((f) => `  ${f}`).join('\n');
</script>
</body>
</html>
